<!doctype html>
<html lang="en" data-theme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Born to BUILD — hero motion prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ---------- tokens (4 themes; --ia/--ok/--danger per theme, nothing fixed) ---------- */
:root{
  --bg:#090b10; --panel:#11141c; --line:#232a38; --line-2:#3a4458;
  --fg:#e6eaf2; --dim:#8e97aa; --action:#4d7cff; --data:#5be7ff;
  --ia:#ff7a3d; --ok:#3ddc97; --danger:#ff4d5e; --guide:#ff2bd6;
  --l1:#141b2e; --l2:#1c2a52; --l3:#2c4a9c; --l4:#4d7cff; --l4-fg:#0a1020;
  --font-serif:'Instrument Serif', Georgia, serif;
  --font-display:'Anton', Impact, sans-serif;
  --font-sans:'Geist', system-ui, sans-serif;
  --font-mono:'Geist Mono', ui-monospace, monospace;
  --glow:0;
}
html[data-theme="mono"]{ --bg:#0e0e0f; --panel:#161618; --line:#34343a; --line-2:#48484f; --fg:#e9e9ea; --dim:#9a9a9f; --action:#e9e9ea; --data:#c3c7cf; --ia:#a9a9b0; --ok:#e9e9ea; --danger:#ff5c5c; --guide:#e9e9ea; --l1:color-mix(in srgb, var(--action) 8%, var(--panel)); --l2:color-mix(in srgb, var(--action) 22%, var(--panel)); --l3:color-mix(in srgb, var(--action) 50%, var(--panel)); --l4:var(--action); --l4-fg:#0e0e0f; }
html[data-theme="ember"]{ --bg:#0e0d0c; --panel:#171513; --line:#2e2a26; --line-2:#443e37; --fg:#ede6da; --dim:#a49b8e; --action:#ff6b3d; --data:#ffb38a; --ia:#ffb347; --ok:#9bd17a; --danger:#ff4d4d; --guide:#ff6b3d; --l1:color-mix(in srgb, var(--action) 8%, var(--panel)); --l2:color-mix(in srgb, var(--action) 22%, var(--panel)); --l3:color-mix(in srgb, var(--action) 50%, var(--panel)); --l4:var(--action); --l4-fg:#1a0e08; }
html[data-theme="acid"]{ --bg:#0c0c0c; --panel:#151515; --line:#2c2c2c; --line-2:#3f3f3f; --fg:#f2f2f2; --dim:#9c9c9c; --action:#d4ff3f; --data:#e8ff8a; --ia:#ff6ad5; --ok:#d4ff3f; --danger:#ff4d5e; --guide:#ff6ad5; --l1:color-mix(in srgb, var(--action) 8%, var(--panel)); --l2:color-mix(in srgb, var(--action) 22%, var(--panel)); --l3:color-mix(in srgb, var(--action) 50%, var(--panel)); --l4:var(--action); --l4-fg:#0c0c0c; }

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:15px;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--data);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit}

/* ---------- test bar (remove in the real site) ---------- */
.testbar{position:fixed;top:10px;right:12px;z-index:50;display:flex;gap:6px;font:11px/1 var(--font-mono);color:var(--dim)}
.testbar select,.testbar input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 8px}
.testbar input{width:76px}

/* ---------- hero ---------- */
.hero{
  position:relative;min-height:100svh;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;
  background-image:radial-gradient(var(--line) 1px, transparent 1.2px);background-size:24px 24px;background-position:center;
}
.hero__left{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:clamp(24px,6vw,84px) clamp(20px,5vw,64px)}
.eyebrow{font:500 11px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.title{margin:0;font:400 clamp(64px,12vw,180px)/.88 var(--font-serif);letter-spacing:-.01em}
.title em{font-style:italic}
.title b{display:block;font:400 1.08em/.88 var(--font-display);text-transform:uppercase;letter-spacing:.01em}
.roles{display:flex;flex-direction:column;gap:6px;font:400 13px/1.5 var(--font-mono);color:var(--dim);margin:0;padding:0;list-style:none}
.roles b{color:var(--fg);font-weight:500}
.links{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.links a{font:500 12px/1 var(--font-mono);text-decoration:none;border:1px solid var(--line-2);border-radius:999px;padding:9px 13px;transition:border-color .2s,color .2s}
.links a:hover{border-color:var(--action);color:var(--action)}

/* seal — on the seam, ABOVE the scene, stays clickable */
.seal{position:absolute;left:50%;top:50%;width:116px;height:116px;transform:translate(-50%,-50%);z-index:5;text-decoration:none;cursor:pointer;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 12px 40px -12px #0008}
.seal svg{width:100%;height:100%;display:block}
.seal .ring{animation:spin 16s linear infinite;transform-origin:50% 50%}
.seal:hover .ring{animation-duration:6s}
.seal text{font:500 11.5px var(--font-mono);letter-spacing:.2em;fill:var(--dim)}
.seal .mark{font:400 36px var(--font-display);fill:var(--fg)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- scene (desktop) ---------- */
.scene{position:relative;z-index:1;min-height:520px;user-select:none;-webkit-user-select:none}
.scene.is-live{cursor:none}
.scene.is-live .tb button{cursor:none}
.stage{position:absolute;left:0;top:0;width:724px;height:800px;transform-origin:0 0;transform:translate(var(--ox,0px),var(--oy,0px)) scale(var(--s,1))}
.stage svg.canvas{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.overlay{position:absolute;inset:0;pointer-events:none}

/* toolbar (below the diagram, always there) */
.tb{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:3;display:flex;gap:4px;align-items:center;padding:5px;border-radius:12px;background:var(--panel);border:1px solid var(--line-2);box-shadow:0 10px 30px -18px #000}
.pill{font:500 12px/1 var(--font-mono);color:var(--fg);background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px;display:inline-flex;gap:9px;align-items:center;cursor:pointer;transition:border-color .2s,background .2s;white-space:nowrap}
.pill:hover{background:var(--line)}
.pill .seg{display:inline-flex;gap:5px;color:var(--dim)}
.pill .seg span.on{color:var(--action)}
.pill[aria-pressed="true"]{border-color:var(--action)}
.pill.ghostly{color:var(--dim)}
.pill[hidden]{display:none}

/* canvas styling */
.canvas{--mixed:color-mix(in srgb, var(--line-2), var(--action) calc(var(--glow) * 100%))}
.plate{transition:none}
.frame.l2 rect{fill-opacity:.4}.frame.l3 rect{fill-opacity:.45}.frame.l4 rect{fill-opacity:.55}
.frame text{font:500 11px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;fill:var(--dim)}
.frame .ico{fill:var(--dim)}
.node rect.box{fill:var(--panel);stroke:var(--mixed);stroke-width:1.2;transition:stroke .15s}
.plate.l4 .node rect.box{fill:color-mix(in srgb, #fff 60%, var(--l4));stroke:color-mix(in srgb, #fff 30%, var(--l4))}
.plate.l4 .node text{fill:var(--l4-fg)} .plate.l4 .node .ico{fill:var(--l4-fg)} .plate.l4 .node .caret{fill:var(--l4-fg)}
.plate .face{fill:var(--lp);stroke:color-mix(in srgb, #fff 12%, var(--lp));stroke-width:1}
.plate .sideL{fill:color-mix(in oklab, var(--lp) 70%, black)} .plate .sideR{fill:color-mix(in oklab, var(--lp) 82%, black)}
.plate.l1{--lp:var(--l1)} .plate.l2{--lp:var(--l2)} .plate.l3{--lp:var(--l3)} .plate.l4{--lp:var(--l4)}
.plate .ptitle{font:500 13px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;fill:var(--fg);fill-opacity:.8}
.plate.l4 .ptitle{fill:var(--l4-fg)} .plate .ico{fill:var(--fg);fill-opacity:.8} .plate.l4 .ico{fill:var(--l4-fg)}
.shadow{fill:#000}
.node rect.depth{fill:color-mix(in oklab, var(--lp) 42%, black)} .plate.l4 .node rect.depth{fill:color-mix(in oklab, var(--l4) 62%, black)}
.riser{stroke:var(--dim);stroke-opacity:calc(.75 + var(--glow) * .25);stroke-width:1.6;stroke-dasharray:5 5;stroke-linecap:round}
.riser.hot{stroke:var(--action);stroke-opacity:1} .riser.bad{stroke:var(--danger);stroke-opacity:1;stroke-width:2}
.rface{stroke-dasharray:none;stroke-width:1.8}
.rhead{fill:var(--dim)} .rhead.hot{fill:var(--action)} .rhead.bad{fill:var(--danger)}
.pulse{fill:var(--data)}
.node.hover rect.box,.node.grab rect.box{stroke:var(--action)}
.node text{font:500 18px var(--font-mono);fill:var(--fg)}
.node .ico{fill:var(--fg);fill-opacity:.9}
.node .caret{fill:var(--action)}
.node .squig{stroke:var(--danger);stroke-width:1.5;fill:none}
.node .badge{fill:var(--danger)}
.node .badge-ring{fill:none;stroke:var(--danger);stroke-width:1}
.node.misplaced rect.box,.node.orphan rect.box{stroke:var(--danger);stroke-dasharray:4 3}
.node.fail rect.box{stroke:var(--danger)}
.arrow{fill:none;stroke:var(--mixed);stroke-opacity:calc(.55 + var(--glow) * .45);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrow.hot{stroke:var(--action);stroke-opacity:1}
.arrow.bad{stroke:var(--danger);stroke-opacity:1;stroke-width:2}
.port{fill:var(--bg);stroke:var(--line-2);stroke-width:1.5}
.port.bad{stroke:var(--danger)}
#mk-head path{fill:var(--dim);fill-opacity:.7} #mk-head-bad path{fill:var(--danger)} #mk-head-hot path{fill:var(--action)}
.sel polygon.box{fill:none;stroke:var(--action);stroke-width:1.2}
.sel rect.h{fill:var(--bg);stroke:var(--action);stroke-width:1.2}
.marquee{fill:var(--action);fill-opacity:.08;stroke:var(--action);stroke-width:1;stroke-dasharray:3 3}
.guide{stroke:var(--guide);stroke-width:1;stroke-dasharray:4 3}
.pin circle{fill:var(--action);stroke:var(--bg);stroke-width:1.5}
.pin text{font:600 9px var(--font-mono);fill:var(--bg)}
.pin.done circle{fill:var(--ok)}
.fx line,.fx circle{pointer-events:none}

/* cursors (HTML overlay, stage coordinates). Tip = (0,0) */
.cursor{position:absolute;left:0;top:0;will-change:transform;transform-origin:0 0;opacity:0}
.cursor svg{display:block;width:14px;height:19px;overflow:visible;transform-origin:0 0}
.cursor .arrowhead{fill:var(--c);stroke:var(--bg);stroke-width:1.2;stroke-linejoin:round}
.cursor .tag{position:absolute;left:13px;top:14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;white-space:nowrap}
.cursor.flip .tag{left:auto;right:4px;align-items:flex-end}
.cursor.flip .bubble{transform-origin:100% 0}
.cursor .name{font:500 11px/1 var(--font-mono);color:var(--bg);background:var(--c);border-radius:999px;padding:4px 7px;letter-spacing:.02em}
.cursor .bubble{font:500 11px/1.2 var(--font-mono);color:var(--fg);background:var(--panel);border:1px solid var(--line-2);border-radius:999px;padding:5px 9px;transform-origin:0 0;opacity:0}
.cursor.ia{--c:var(--ia)} .cursor.fb{--c:var(--action)} .cursor.you{--c:var(--data)}
html[data-theme="mono"] .cursor.ia .arrowhead{fill:var(--bg);stroke:var(--ia);stroke-width:1.4}
html[data-theme="mono"] .cursor.ia .name{background:var(--bg);color:var(--ia);box-shadow:inset 0 0 0 1px var(--ia)}
.ghost{position:absolute;left:0;top:0;width:14px;height:19px;opacity:0;will-change:transform;transform-origin:0 0}
.ghost svg{display:block;width:14px;height:19px;overflow:visible}
.ghost path{fill:var(--c)}

/* chips / toasts / terminal */
.chip{position:absolute;font:500 11px/1 var(--font-mono);padding:7px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line-2);color:var(--fg);transform-origin:0 50%;opacity:0;white-space:nowrap}
.chip.warn{color:var(--danger);border-color:var(--danger)}
.chip.ok{color:var(--ok);border-color:var(--ok);left:16px;top:12px;font-size:12px;padding:8px 12px;display:flex;gap:8px;align-items:center}
.chip.ok .bar{width:64px;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;display:none}
.chip.ok .bar i{display:block;height:100%;width:0;background:var(--ok);transform-origin:0 50%}
.chip.ok.running{color:var(--fg);border-color:var(--line-2)}
.chip.ok.running .bar{display:block}
.chip.ok.failing{color:var(--danger);border-color:var(--danger)}
.chip.ok.failing .bar{display:block}
.chip.ok.failing .bar i{background:var(--danger)}
.chip.ok .ring{position:absolute;inset:-1px;border-radius:999px;border:1px solid var(--ok);opacity:0;pointer-events:none}
.toast{position:absolute;right:14px;bottom:12px;font:500 10.5px/1.3 var(--font-mono);color:var(--fg);background:var(--panel);border:1px solid var(--line-2);border-left:2px solid var(--ok);border-radius:8px;padding:7px 10px;opacity:0;width:230px;overflow-wrap:anywhere;transform-origin:100% 100%}
.term{position:absolute;left:520px;top:26px;width:190px;height:168px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;font:500 10px/1.4 var(--font-mono);color:var(--fg);padding:8px 10px;opacity:0;transform-origin:100% 0;overflow:hidden;box-shadow:0 12px 30px -16px #000}
.term .hd{display:flex;gap:4px;align-items:center;color:var(--dim);margin-bottom:5px;font-size:10px}
.term .hd i{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:inline-block}
.term .ln{color:var(--dim);overflow-wrap:anywhere}
.term .ln.c{color:var(--fg)}
.term .ln.ok{color:var(--ok)} .term .ln.bad{color:var(--danger)}
.term .ln .p{color:var(--action)}

/* ---------- mobile diagram (same concept as the OG image) ---------- */
.mobile{display:none}
.seal-m{display:none}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;min-height:0}
  .hero__left{padding:28px 16px 18px;gap:22px}
  .title{font-size:clamp(64px,19vw,110px)}
  .seal{display:none}
  .links a{font-size:11px;padding:8px 11px}
  .seal-m{display:block;position:relative;left:auto;top:auto;transform:none;width:64px;height:64px;margin-left:auto;align-self:center}
  .seal-m text{font-size:13px;letter-spacing:.16em}
  .seal-m .mark{font-size:40px}
  .scene{display:none}
  .mobile{display:block;position:relative;padding:0 68px 28px}   /* 16 px gutter + 50 px margin: cursors live outside the blocks */
  .mb{position:relative;border-radius:12px;padding:10px 14px 11px;margin:0 0 10px;min-height:64px;background:var(--l);border:1px solid transparent;opacity:0;transform:translateY(8px)}
  .mb.ready{animation:mbin .3s cubic-bezier(.22,1,.36,1) forwards}
  .mb h3{margin:0 0 6px;font:500 10px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);opacity:.85;white-space:nowrap}
  .mb .ns{display:flex;gap:8px;flex-wrap:wrap}
  .mb .n{font:500 12px/1 var(--font-mono);color:var(--fg);background:var(--panel);border-radius:7px;padding:7px 10px;display:inline-flex;gap:7px;align-items:center}
  .mb .n svg{width:13px;height:13px;fill:var(--fg)}
  .mb.l1{--l:var(--l1);border-color:var(--line-2)} .mb.l2{--l:var(--l2)} .mb.l3{--l:var(--l3)} .mb.l4{--l:var(--l4)}
  .mb.l4 h3{color:var(--l4-fg);opacity:.8}
  .mb.l4 .n{background:color-mix(in srgb, #fff 58%, var(--l4));color:var(--l4-fg)}
  .mcur{position:absolute;display:flex;pointer-events:none}
  .mcur svg{width:14px;height:19px;overflow:visible;flex:none}
  .mcur .arrowhead{fill:var(--c);stroke:var(--bg);stroke-width:1.2}
  .mcur .name{font:500 10px/1 var(--font-mono);color:var(--bg);background:var(--c);border-radius:999px;padding:3px 6px;white-space:nowrap}
  .mcur.fb{--c:var(--action);right:100%;top:50%;transform:translateY(-10px);flex-direction:column;align-items:flex-end;gap:2px}
  .mcur.fb svg{transform:scaleX(-1);transform-origin:50% 0}
  .mcur.fb .arrowhead{stroke:var(--fg)}
  .mcur.fb .name{margin-right:3px}
  .mcur.ia{--c:var(--ia);left:100%;bottom:-26px;flex-direction:column;align-items:flex-start;gap:2px;margin-left:4px}
  .mcur.ia .tag{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
  .mcur.ia .bubble{font:500 12px/1 var(--font-mono);background:var(--panel);border:1px solid var(--line-2);border-radius:999px;padding:4px 7px}
  html[data-theme="mono"] .mcur.ia .arrowhead{fill:var(--bg);stroke:var(--ia)}
  html[data-theme="mono"] .mcur.ia .name{background:var(--bg);color:var(--ia);box-shadow:inset 0 0 0 1px var(--ia)}
  @keyframes mbin{to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){ .seal .ring{animation:none} .links a,.pill{transition:none} .mb.ready{animation:none;opacity:1;transform:none} }
</style>
</head>
<body>

<div class="testbar" aria-label="test controls">
  <select id="theme" aria-label="Theme"><option value="blue">blue</option><option value="mono">mono</option><option value="ember">ember</option><option value="acid">acid</option></select>
  <select id="lang" aria-label="Language"><option value="en">en</option><option value="pt">pt</option></select>
  <input id="seedIn" type="number" aria-label="Seed" placeholder="seed">
</div>

<section class="hero">
  <div class="hero__left">
    <div class="eyebrow">Felipe Castro — Full-Stack Engineer</div>
    <h1 class="title"><em>Born to</em> <b>BUILD.</b></h1>
    <ul class="roles">
      <li><b>Full-stack developer</b> — Brasília, BR</li>
      <li>Head of IT @ Nexara · Clean Architecture, Next.js, FastAPI, PostgreSQL</li>
    </ul>
    <div class="links">
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn ↗</a>
      <a href="https://github.com/Felipebc2" target="_blank" rel="noopener">GitHub ↗</a>
      <a href="#contact">Contact</a>
      <a class="seal seal-m" href="https://github.com/Felipebc2" target="_blank" rel="noopener" aria-label="See my code on GitHub">
        <svg viewBox="0 0 116 116" aria-hidden="true"><defs><path id="sealpath2" d="M58,58 m-42,0 a42,42 0 1,1 84,0 a42,42 0 1,1 -84,0"/></defs><g class="ring"><text><textPath href="#sealpath2" startOffset="0">• See my code • See my code </textPath></text></g><text class="mark" x="58" y="68" text-anchor="middle">↗</text></svg>
      </a>
    </div>
  </div>

  <!-- GitHub seal placeholder: on the seam, above the scene -->
  <a class="seal" href="https://github.com/Felipebc2" target="_blank" rel="noopener" aria-label="See my code on GitHub">
    <svg viewBox="0 0 116 116" aria-hidden="true">
      <defs><path id="sealpath" d="M58,58 m-42,0 a42,42 0 1,1 84,0 a42,42 0 1,1 -84,0"/></defs>
      <g class="ring"><text><textPath href="#sealpath" startOffset="0">• See my code • See my code </textPath></text></g>
      <text class="mark" x="58" y="71" text-anchor="middle">↗</text>
    </svg>
  </a>

  <div class="scene" id="scene" role="group" aria-label="">
    <div class="tb" id="tb" aria-label="Canvas toolbar">
      <button class="pill" id="ship" type="button" aria-pressed="false"><span class="label">⚡ Ship faster</span><span class="seg"><span class="on">1×</span><span>·</span><span>2×</span><span>·</span><span>4×</span></span></button>
      <button class="pill ghostly" id="rebuild" type="button" hidden>↻ rebuild</button>
    </div>
    <div class="stage" id="stage" aria-hidden="true">
      <svg class="canvas" id="canvas" viewBox="0 0 724 800">
        <defs>
          <marker id="mk-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z"/></marker>
          <marker id="mk-head-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z"/></marker>
          <marker id="mk-head-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z"/></marker>
        </defs>
        <g id="stack"></g>
        <g id="sels"></g>
        <g class="pin" id="pin" opacity="0"><circle r="8"/><text y="3" text-anchor="middle">F</text></g>
        <g id="fx" class="fx"></g>
        <text id="measure" style="font:500 18px var(--font-mono);opacity:0;pointer-events:none"></text>
      </svg>
      <div class="overlay" id="overlay">
        <div class="term" id="term"><div class="hd"><i></i><i></i><i></i>&nbsp;terminal</div><div class="ls"></div></div>
        <div class="chip ok" id="chipOk"><span class="ring"></span><span class="txt">✓ deployed</span><span class="bar"><i></i></span></div>
      </div>
    </div>
  </div>

  <div class="mobile" id="mobile" aria-hidden="true"></div>
</section>
